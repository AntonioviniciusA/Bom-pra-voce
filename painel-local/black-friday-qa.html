<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparação Black Friday</title>
    <style>
      body { margin: 0; padding: 24px; background: #ece9f5; color: #211743; font: 600 16px Inter, Arial, sans-serif; }
      h1 { margin: 0 0 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
      figure { margin: 0; padding: 14px; background: white; border-radius: 14px; box-shadow: 0 6px 24px #28165f1f; }
      figcaption { margin-bottom: 10px; }
      img { display: block; width: 100%; height: auto; border: 1px solid #d7d1e6; }
      .implementation { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; align-items: start; }
      .implementation img { min-width: 0; }
    </style>
  </head>
  <body>
    <h1>Black Friday — referência × implementação atual</h1>
    <main>
      <figure>
        <figcaption>Prancha de referência</figcaption>
        <img src="/@fs/D:/GitHub/Bom-pra-voce/bom-pra-voce-novo/src/images/offer-themes/black-friday/referencias/18-black-friday.png" alt="Prancha de referência Black Friday" />
      </figure>
      <figure>
        <figcaption>Implementação — notebook e celular</figcaption>
        <div class="implementation">
          <img src="/@fs/D:/GitHub/Bom-pra-voce/bom-pra-voce-novo/src/images/offer-themes/black-friday/evidencias/atual/semana-desktop.png" alt="Implementação em notebook" />
          <img src="/@fs/D:/GitHub/Bom-pra-voce/bom-pra-voce-novo/src/images/offer-themes/black-friday/evidencias/atual/semana-mobile.png" alt="Implementação em celular" />
        </div>
      </figure>
    </main>
  </body>
</html>
